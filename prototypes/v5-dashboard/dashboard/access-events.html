<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page Title</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=bar_chart_4_bars,person" />

    <link href="dist.css" rel="stylesheet">
</head>
<body class="flex min-h-screen bg-bg text-text font-sans antialiased">
    <div class="group top 0 sticky h-screen bg-[#0b1220] flex flex-col items-start w-14 hover:w-48 transition[width] duration-200">
        <div class="mx-3 mt-3 mb-5 w-8 h-8 rounded-md flex items-center justify-center flex-shrink-0 bg-accent">
            logo
        </div>

        <nav class="flex flex-col gap-1 w-full items-center group-hover:items-start group-hover:px-2">
            <div class="sidebar-item sidebar-item-active" title="Access Events">
                <div class="sidebar-icon">
                   <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chart-column-icon lucide-chart-column"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
                </div>
                <span class="sidebar-label">Access Events</span>
            </div>
            <div class="sidebar-item sidebar-item-inactive" title="Users">
                <div class="sidebar-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-icon lucide-user"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
                <span class="sidebar-label">Users</span>
            </div>
        </nav>
    </div>
    
    <div class="flex-1 min-w-0 px-9 pt-7 pb-12">
        <h1 class="text-[25px] font-semibold mb-[22px]">Access Events</h1>

        <div class="grid grid-cols-2 gap-4 mb-[22px]">
            <div class="stat-card">
                <div class="text-[20px] font-semibold text-dim ">Events Today</div>
                <div class="flex gap-8">
                    <div class="flex flex-col gap-1">
                        <div class="text-[44px] font-semibold text-granted" id="granted-today">-</div>
                        <div class="text-[12.5px] text-muted">Access Granted</div>
                    </div>
                    <div class="flex flex-col gap-1">
                        <div class="text-[44px] font-semibold text-warning" id="denied-today">-</div>
                        <div class="text-[12.5px] text-muted">Failed Attempts</div>
                    </div>
                    <div class="flex flex-col gap-1">
                        <div class="text-[44px] font-semibold text-critical" id="lockout-today">-</div>
                        <div class="text-[12.5px] text-muted">Locked Out</div>
                    </div>
                </div>
            </div>

            <div class="stat-card stat-card-col">
                <div class="text-[20px] font-semibold text-dim">Active Lockouts</div>
                <div class="flex items-start gap-[22px]">
                    <div class="text-[44px] font-semibold text-critical" id="lockout-count">-</div>
                    <div class="flex-1 flex flex-wrap gap-x-6 gap-y-3 pt-4" id="lockout-list"></div>
                </div>
            </div>
        </div>

        <div class="flex gap-3 mb-4 flex-wrap items-center">
            <div class="relative dropdown-container">
                <div class="filter-pill cursor-pointer select-none dropdown-btn flex items-center gap-2">
                    <span class="text-dim">Time Range</span>
                    <span class="font-medium text-text selected-label">Last 24 hours</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down w-3.5 h-3.5 text-dim transition-transform duration-200 chevron"><path d="m6 9 6 6 6-6"/></svg>
                </div>
                <div class="absolute top-full mt-1.5 left-0 w-48 bg-surface border border-border rounded-xl shadow-xl hidden z-30 flex flex-col p-1.5 dropdown-menu">
                    <button class="dropdown-option w-full text-left px-3 py-2 text-xs font-medium text-text hover:bg-white/[0.06] rounded-lg cursor-pointer">Last 24 hours</button>
                    <button class="dropdown-option w-full text-left px-3 py-2 text-xs font-medium text-text hover:bg-white/[0.06] rounded-lg cursor-pointer">Last 7 days</button>
                    <button class="dropdown-option w-full text-left px-3 py-2 text-xs font-medium text-text hover:bg-white/[0.06] rounded-lg cursor-pointer">Last 30 days</button>
                </div>
            </div>
            <div class="relative dropdown-container">
                <div class="filter-pill cursor-pointer select-none dropdown-btn flex items-center gap-2">
                    <span class="text-dim">User</span>
                    <span class="font-medium text-text selected-label">All users</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down w-3.5 h-3.5 text-dim transition-transform duration-200 chevron"><path d="m6 9 6 6 6-6"/></svg>
                </div>
                <div class="absolute top-full mt-1.5 left-0 w-48 bg-surface border border-border rounded-xl shadow-xl hidden z-30 flex flex-col p-1.5 dropdown-menu">
                </div>
            </div>
            <div class="relative dropdown-container">
                <div class="filter-pill cursor-pointer select-none dropdown-btn flex items-center gap-2">
                    <span class="text-dim">Event Type</span>
                    <span class="font-medium text-text selected-label">All events</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down w-3.5 h-3.5 text-dim transition-transform duration-200 chevron"><path d="m6 9 6 6 6-6"/></svg>
                </div>
                <div class="absolute top-full mt-1.5 left-0 w-48 bg-surface border border-border rounded-xl shadow-xl hidden z-30 flex flex-col p-1.5 dropdown-menu">
                    <button class="dropdown-option w-full text-left px-3 py-2 text-xs font-medium text-text hover:bg-white/[0.06] rounded-lg cursor-pointer">All events</button>
                    <button class="dropdown-option w-full text-left px-3 py-2 text-xs font-medium text-text hover:bg-white/[0.06] rounded-lg cursor-pointer">Access Granted</button>
                    <button class="dropdown-option w-full text-left px-3 py-2 text-xs font-medium text-text hover:bg-white/[0.06] rounded-lg cursor-pointer">Lockout Triggered</button>
                </div>
            </div>
        </div>

        <div class="bg-surface border border-border rounded-[10px] max-h-[70vh] flex flex-col overflow-hidden">
            <div class="flex-none bg-surface2">
                <table class="w-full table-fixed border-collapse">
                    <colgroup>
                        <col class="w-[31%]">
                        <col class="w-[32%]">
                        <col class="w-[26%]">
                        <col class="w-[11%]">
                    </colgroup>
                    <thead>
                        <tr>
                            <th class="table-header-cell">Timestamp</th>
                            <th class="table-header-cell">Event</th>
                            <th class="table-header-cell">User</th>
                            <th class="table-header-cell">Capture</th>  
                        </tr>
                    </thead>
                </table>
            </div>
            <div class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden">
                <table class="w-full table-fixed border-collapse">
                    <colgroup>
                        <col class="w-[31%]">
                        <col class="w-[32%]">
                        <col class="w-[26%]">
                        <col class="w-[11%]">
                    </colgroup>
                    <tbody id="event-rows"></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <div class="fixed inset-0 bg-[rgba(5,9,18,0.72)] backdrop-blur-[2px] z-50 p-5 hidden items-center justify-center" id="modal-backdrop">
        <div class="bg-surface border border-border rounded-xl w-full max-w-[560px] max-h-[90vh] overflow-auto shadow-[0_20px_60px_rgba(0,0,0,0.5)]">
            <div class="flex items-center justify-between px-[22px] py-[18px] border-b border-border">
                <div class="flex items-center gap-2.5 text-[15px] font-semibold" id="modal-title"><span class="w-2 h-2 rounded-full bg-critical"></span> Lockout Triggered</div>
                <button class="w-7 h-7 rounded-[7px] flex items-center justify-center text-dim cursor-pointer border-0 bg-transparent hover:bg-white/[0.06] hover:text-text" id="modal-close">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x-icon lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
            <div class="p-[22px] flex gap-5" id="modal-body"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
